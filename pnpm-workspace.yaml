allowBuilds:
  "@biomejs/biome": true
  "@tailwindcss/oxide": true
  "core-js": true
  "iframe-resizer": true
  "sharp": true
minimumReleaseAgeExclude:
  - cronstrue@3.20.0
  - '@commercelayer/core'
  - '@commercelayer/hooks'
  - '@commercelayer/react-components'
  - '@commercelayer/core-components@5.0.0-beta.13 || 5.0.1-beta.0'
  - '@commercelayer/react-hooks-components@5.0.0-beta.13 || 5.0.1-beta.0'
overrides:
  "postcss": 8.5.15
  # react-components pins the SDK as a hard dependency rather than a peer, so
  # without this the app's v7 and the library's v8 both install and their Order
  # types stop being assignable at the OrderContainer boundary.
  "@commercelayer/sdk": "8.0.0-beta.11"
blockExoticSubdeps: false
