allowBuilds:
  "@biomejs/biome": true
  "@tailwindcss/oxide": true
  "core-js": true
  "iframe-resizer": true
  "sharp": true
minimumReleaseAgeExclude:
  - cronstrue@3.20.0
  # Our own packages: minimumReleaseAge guards against third-party supply chain
  # risk, not against ourselves. Left unversioned so a bump never fails the
  # install with an error that reads like an unpublish.
  - '@commercelayer/react-components'
  - '@commercelayer/core-components'
  - '@commercelayer/react-hooks-components'
  - '@commercelayer/sdk'
overrides:
  "postcss": 8.5.15
  # react-components pins the SDK as a hard dependency rather than a peer — the
  # preview in use still names a pkg.pr.new build of it — so without this two
  # copies install and their Order types stop being assignable at the
  # OrderContainer boundary. Keep it in step with the app's own dependency.
  "@commercelayer/sdk": "8.0.2"
blockExoticSubdeps: false
