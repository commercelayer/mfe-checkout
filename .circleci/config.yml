version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4.1
  aws-s3: circleci/aws-s3@4.1.3

jobs:
  # Installs and builds once; the parallel `test` nodes attach the result
  # instead of each repeating it. A rerun from failed reuses this workspace.
  e2e-build:
    docker:
      - image: mcr.microsoft.com/playwright:v1.63.0-noble
    resource_class: medium+

    environment:
      PLAYWRIGHT_BROWSERS_PATH: 0

    steps:
      - checkout
      - restore_cache:
          name: Restore pnpm Package Cache
          keys:
            - pnpm-packages-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install pnpm
          command: |
            npm install -g pnpm@11
      - run:
          name: Setup
          command: |
            pnpm install
      - run:
          name: Audit
          command: pnpm audit --audit-level high && pnpm audit || exit 0
      - run:
          name: Install Playwright
          command: |
            pnpm playwright install chromium
      - save_cache:
          name: Save pnpm Package Cache
          key: pnpm-packages-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ./node_modules
            - ./.next/cache
      - run:
          name: Export
          command: |
            pnpm run build
      - persist_to_workspace:
          root: .
          paths:
            # Chromium is inside node_modules (PLAYWRIGHT_BROWSERS_PATH=0)
            - node_modules
            - out/dist

  test:
    docker:
      - image: mcr.microsoft.com/playwright:v1.63.0-noble
    resource_class: medium+
    parallelism: 10

    environment:
      PLAYWRIGHT_BROWSERS_PATH: 0

    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install pnpm
          command: |
            npm install -g pnpm@11
      - run:
          name: Run tests
          no_output_timeout: 15m
          command: |
            pnpm run serve --no-request-logging &
            circleci testsuite run e2e
      - store_test_results:
          # Must match outputs.junit in .circleci/test-suites.yml
          path: test-reports
      - store_artifacts:
          path: test-results

  build:
    docker:
      - image: cimg/node:24.5.0
    resource_class: medium
    environment:
      FOLDER: checkout
      NEXT_PUBLIC_DOMAIN: commercelayer.co
      NEXT_PUBLIC_HOSTED: true
      NEXT_PUBLIC_SLUG: ""
      NEXT_PUBLIC_STAGE: "STG"
      NODE_ENV: production
      NEXT_PUBLIC_BASE_PATH: /checkout
    steps:
      - checkout
      - run:
          name: Install
          command: pnpm install
      - run:
          name: Build
          command: pnpm build
      - aws-cli/setup:
          aws_access_key_id: AWS_ACCESS_KEY
          aws_secret_access_key: AWS_SECRET_ACCESS_KEY
      - aws-s3/sync:
          from: out/dist
          to: "s3://$S3_ASSETS_BUCKET/team/fe-static-apps/$FOLDER/<<pipeline.git.tag>>"

  build-on-pci-bucket:
    docker:
      - image: cimg/node:24.5.0
    resource_class: medium
    environment:
      FOLDER: checkout
      NEXT_PUBLIC_DOMAIN: commercelayer.io
      NEXT_PUBLIC_SLUG: ""
      NEXT_PUBLIC_STAGE: "PRD"
      NODE_ENV: production
      NEXT_PUBLIC_HOSTED: true
      NEXT_PUBLIC_BASE_PATH: /checkout
    steps:
      - checkout
      - run:
          name: Get version
          command: |
            pnpm -v
            npm -v
            node -v
      - run:
          name: Install
          command: pnpm install
      - run:
          name: Build
          command: pnpm build
      - aws-cli/setup:
          aws_access_key_id: AWS_ACCESS_KEY
          aws_secret_access_key: AWS_SECRET_ACCESS_KEY
      - aws-s3/sync:
          from: out/dist
          to: "s3://$S3_PCI_BUCKET/$FOLDER/<<pipeline.git.tag>>-<<pipeline.git.revision>>"

workflows:
  tests:
    jobs:
      - e2e-build:
          context: commercelayer
          filters:
            tags:
              ignore: /v.*/
      - test:
          context: commercelayer
          requires:
            - e2e-build
          filters:
            tags:
              ignore: /v.*/

  build-and-push:
    jobs:
      - build:
          context: commercelayer
          filters:
            tags:
              only: /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*).*/
            branches:
              ignore: /.*/

  build-and-push-on-pci-bucket:
    jobs:
      - build-on-pci-bucket:
          context: commercelayer
          filters:
            tags:
              only: /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/
            branches:
              ignore: /.*/
